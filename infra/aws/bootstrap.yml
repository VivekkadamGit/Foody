AWSTemplateFormatVersion: '2010-09-09'
Description: >
  Chakh — one-time bootstrap. Creates what GitHub Actions needs before the first deploy:
  the image registry, the S3 bucket for static files, and the roles GitHub signs in with.
  Deploy once by hand (see docs/deploy/aws.md). The app itself lives in app.yml.

Parameters:
  GitHubRepo:
    Type: String
    Default: VivekkadamGit/Foody
    Description: owner/name of the GitHub repository allowed to deploy.
  DeployBranch:
    Type: String
    Default: master
  AppStackName:
    Type: String
    Default: chakh-app
    Description: Name of the app stack the workflow deploys (app.yml).
  CreateOidcProvider:
    Type: String
    Default: 'true'
    AllowedValues: ['true', 'false']
    Description: false if this AWS account already has the token.actions.githubusercontent.com identity provider.

Conditions:
  MakeOidc: !Equals [!Ref CreateOidcProvider, 'true']

Resources:
  GitHubOidc:
    Type: AWS::IAM::OIDCProvider
    Condition: MakeOidc
    Properties:
      Url: https://token.actions.githubusercontent.com
      ClientIdList: [sts.amazonaws.com]
      ThumbprintList: [6938fd4d98bab03faadb97b34396831e3780aea1]

  ImageRepo:
    Type: AWS::ECR::Repository
    Properties:
      RepositoryName: chakh
      ImageScanningConfiguration: { ScanOnPush: true }
      LifecyclePolicy:
        LifecyclePolicyText: |
          {"rules":[{"rulePriority":1,"description":"Keep the last 20 images",
            "selection":{"tagStatus":"any","countType":"imageCountMoreThan","countNumber":20},
            "action":{"type":"expire"}}]}

  # /_next/static/* and /brand/* — read only by CloudFront (bucket policy in app.yml).
  # No expiry rule: unchanged hashed files are not re-uploaded, so age says nothing about use.
  StaticBucket:
    Type: AWS::S3::Bucket
    DeletionPolicy: Retain
    UpdateReplacePolicy: Retain
    Properties:
      BucketName: !Sub chakh-static-${AWS::AccountId}-${AWS::Region}
      PublicAccessBlockConfiguration:
        BlockPublicAcls: true
        BlockPublicPolicy: true
        IgnorePublicAcls: true
        RestrictPublicBuckets: true
      OwnershipControls:
        Rules: [{ ObjectOwnership: BucketOwnerEnforced }]
      BucketEncryption:
        ServerSideEncryptionConfiguration:
          - ServerSideEncryptionByDefault: { SSEAlgorithm: AES256 }

  # CloudFormation uses this role to build the app stack, so GitHub's own role stays narrow.
  CfnExecRole:
    Type: AWS::IAM::Role
    Properties:
      AssumeRolePolicyDocument:
        Version: '2012-10-17'
        Statement:
          - Effect: Allow
            Principal: { Service: cloudformation.amazonaws.com }
            Action: sts:AssumeRole
      ManagedPolicyArns: [arn:aws:iam::aws:policy/AdministratorAccess]

  GitHubDeployRole:
    Type: AWS::IAM::Role
    Properties:
      MaxSessionDuration: 3600
      AssumeRolePolicyDocument:
        Version: '2012-10-17'
        Statement:
          - Effect: Allow
            Principal:
              Federated: !If
                - MakeOidc
                - !Ref GitHubOidc
                - !Sub arn:aws:iam::${AWS::AccountId}:oidc-provider/token.actions.githubusercontent.com
            Action: sts:AssumeRoleWithWebIdentity
            Condition:
              StringEquals:
                token.actions.githubusercontent.com:aud: sts.amazonaws.com
              StringLike:
                # Only the deploy branch, or a job using the "production" environment.
                token.actions.githubusercontent.com:sub:
                  - !Sub repo:${GitHubRepo}:ref:refs/heads/${DeployBranch}
                  - !Sub repo:${GitHubRepo}:environment:production
      Policies:
        - PolicyName: deploy
          PolicyDocument:
            Version: '2012-10-17'
            Statement:
              - Effect: Allow
                Action: ecr:GetAuthorizationToken
                Resource: '*'
              - Effect: Allow
                Action:
                  - ecr:BatchCheckLayerAvailability
                  - ecr:BatchGetImage
                  - ecr:GetDownloadUrlForLayer
                  - ecr:InitiateLayerUpload
                  - ecr:UploadLayerPart
                  - ecr:CompleteLayerUpload
                  - ecr:PutImage
                Resource: !GetAtt ImageRepo.Arn
              - Effect: Allow
                Action: s3:ListBucket
                Resource: !GetAtt StaticBucket.Arn
              - Effect: Allow
                Action: [s3:GetObject, s3:PutObject]
                Resource: !Sub ${StaticBucket.Arn}/*
              - Effect: Allow
                Action:
                  - cloudformation:CreateChangeSet
                  - cloudformation:DescribeChangeSet
                  - cloudformation:ExecuteChangeSet
                  - cloudformation:DeleteChangeSet
                  - cloudformation:DescribeStacks
                  - cloudformation:DescribeStackEvents
                Resource: !Sub arn:aws:cloudformation:${AWS::Region}:${AWS::AccountId}:stack/${AppStackName}/*
              - Effect: Allow
                Action: [cloudformation:GetTemplateSummary, cloudformation:ValidateTemplate, ec2:DescribeManagedPrefixLists]
                Resource: '*'
              - Effect: Allow
                Action: iam:PassRole
                Resource: !GetAtt CfnExecRole.Arn
              - Effect: Allow
                Action: cloudfront:CreateInvalidation
                Resource: !Sub arn:aws:cloudfront::${AWS::AccountId}:distribution/*

Outputs:
  EcrRepository:
    Value: !Ref ImageRepo
  StaticBucket:
    Value: !Ref StaticBucket
  DeployRoleArn:
    Value: !GetAtt GitHubDeployRole.Arn
  CfnExecRoleArn:
    Value: !GetAtt CfnExecRole.Arn
