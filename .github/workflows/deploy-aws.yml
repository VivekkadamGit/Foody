# Ships the code to AWS on every push to master (or by hand from the Actions tab): pushes the
# image, uploads the static files, and has ECS roll out the new image. The infrastructure
# itself is Terraform's (terraform/README.md); this workflow never changes it. While the
# environment is down, it tests and then skips the deploy.
# Order matters: the new static files reach S3 before the new server starts, so no visitor
# gets HTML that points at a file that isn't there yet.
name: Deploy to AWS

on:
  push:
    branches: [master]
  workflow_dispatch:

concurrency:
  group: deploy-aws
  cancel-in-progress: false

permissions:
  id-token: write # sign in to AWS with GitHub's OIDC token, no stored AWS keys
  contents: read

env:
  AWS_REGION: ${{ vars.AWS_REGION }}
  CLUSTER: chakh
  SERVICE: chakh-web

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - run: npm test

  deploy:
    needs: test
    runs-on: ubuntu-latest
    environment: production
    steps:
      - uses: actions/checkout@v4

      # Fails when the environment is destroyed (the role goes with it); that just means "skip".
      - id: creds
        continue-on-error: true
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ vars.AWS_DEPLOY_ROLE_ARN }}
          aws-region: ${{ vars.AWS_REGION }}

      - id: env
        name: Is the AWS environment up?
        run: |
          up=false
          if [ "${{ steps.creds.outcome }}" = success ]; then
            n=$(aws ecs describe-services --cluster "$CLUSTER" --services "$SERVICE" \
              --query 'length(services[?status==`ACTIVE`])' --output text 2>/dev/null || echo 0)
            [ "$n" = 1 ] && up=true
          fi
          echo "up=$up" >> "$GITHUB_OUTPUT"
          if [ "$up" = false ]; then
            echo "::notice::AWS environment is down; nothing deployed. Create it with terraform (terraform/README.md), then run this workflow."
          fi

      - id: ecr
        if: steps.env.outputs.up == 'true'
        uses: aws-actions/amazon-ecr-login@v2

      - if: steps.env.outputs.up == 'true'
        uses: docker/setup-buildx-action@v3

      - name: Build image
        if: steps.env.outputs.up == 'true'
        uses: docker/build-push-action@v6
        with:
          context: .
          load: true
          tags: |
            ${{ steps.ecr.outputs.registry }}/chakh:${{ github.sha }}
            ${{ steps.ecr.outputs.registry }}/chakh:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max
          build-args: |
            NEXT_PUBLIC_SUPABASE_URL=${{ secrets.NEXT_PUBLIC_SUPABASE_URL }}
            NEXT_PUBLIC_SUPABASE_ANON_KEY=${{ secrets.NEXT_PUBLIC_SUPABASE_ANON_KEY }}
            NEXT_PUBLIC_GOOGLE_MAPS_API_KEY=${{ secrets.NEXT_PUBLIC_GOOGLE_MAPS_API_KEY }}
            NEXT_PUBLIC_ENABLE_AI_SUGGEST=${{ vars.NEXT_PUBLIC_ENABLE_AI_SUGGEST }}

      - name: Push image
        id: image
        if: steps.env.outputs.up == 'true'
        run: |
          REPO=${{ steps.ecr.outputs.registry }}/chakh
          docker push "$REPO:${{ github.sha }}" # kept for reference: which commit is which image
          docker push "$REPO:latest"            # what the task definition runs
          echo "uri=$REPO:${{ github.sha }}" >> "$GITHUB_OUTPUT"

      # Copy the static files out of the image just built, so they match its build exactly.
      - name: Upload static files to S3
        if: steps.env.outputs.up == 'true'
        run: |
          cid=$(docker create "${{ steps.image.outputs.uri }}")
          mkdir -p out/_next
          docker cp "$cid:/app/.next/static" out/_next/static
          docker cp "$cid:/app/public/brand" out/brand
          docker rm "$cid"
          # Hashed file names never change content: cache for a year. No --delete, so pages
          # still open from the previous build keep finding their files.
          aws s3 sync out/_next/static "s3://${{ vars.STATIC_BUCKET }}/_next/static" \
            --cache-control "public, max-age=31536000, immutable"
          aws s3 sync out/brand "s3://${{ vars.STATIC_BUCKET }}/brand" \
            --cache-control "public, max-age=86400"

      # The task definition runs `latest`, so a new rollout picks up the image just pushed.
      # ECS swaps the server once the new one is healthy and rolls back a broken one.
      - name: Roll out the new image
        if: steps.env.outputs.up == 'true'
        run: |
          aws ecs update-service --cluster "$CLUSTER" --service "$SERVICE" --force-new-deployment > /dev/null
          aws ecs wait services-stable --cluster "$CLUSTER" --services "$SERVICE"

      - name: Refresh logo files at the edge
        if: steps.env.outputs.up == 'true'
        run: |
          read -r ID DOMAIN < <(aws cloudfront list-distributions \
            --query "DistributionList.Items[?Comment=='Chakh'] | [0].[Id, DomainName]" --output text)
          aws cloudfront create-invalidation --distribution-id "$ID" --paths '/brand/*' > /dev/null
          echo "Deployed: https://$DOMAIN" >> "$GITHUB_STEP_SUMMARY"
